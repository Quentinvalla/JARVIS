<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>J.A.R.V.I.S.</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#02060a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root{
    --cyan:#2de1ea;
    --cyan-dim:#0f7c82;
    --bg:#02060a;
    --panel:#04121a;
    --glow: 0 0 12px rgba(45,225,234,.55);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--cyan);
    font-family:'Share Tech Mono',monospace;overflow:hidden;user-select:none;}
  #app{position:relative;height:100vh;width:100vw;display:flex;align-items:center;justify-content:center;}

  /* background grid */
  #app::before{
    content:"";position:absolute;inset:0;
    background-image:
      linear-gradient(rgba(45,225,234,.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(45,225,234,.05) 1px, transparent 1px);
    background-size:28px 28px;
    mask-image: radial-gradient(circle at center, black 40%, transparent 78%);
    pointer-events:none;
  }

  .rings{position:relative;width:min(86vw,420px);height:min(86vw,420px);}
  .ring{position:absolute;border-radius:50%;border:1px solid var(--cyan-dim);
    top:50%;left:50%;transform:translate(-50%,-50%);}
  .ring.r1{width:100%;height:100%;border-style:dashed;animation:spin 40s linear infinite;}
  .ring.r2{width:82%;height:82%;border-color:var(--cyan);opacity:.5;animation:spin 26s linear infinite reverse;}
  .ring.r3{width:64%;height:64%;border-width:2px;box-shadow:var(--glow);animation:pulseRing 2.6s ease-in-out infinite;}
  .tick{position:absolute;top:50%;left:50%;width:2px;height:10px;background:var(--cyan);
    transform-origin:0 0;opacity:.6;}

  @keyframes spin{from{transform:translate(-50%,-50%) rotate(0)}to{transform:translate(-50%,-50%) rotate(360deg)}}
  @keyframes pulseRing{0%,100%{box-shadow:0 0 8px rgba(45,225,234,.4)}50%{box-shadow:0 0 26px rgba(45,225,234,.9)}}

  #core{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:38%;height:38%;border-radius:50%;
    background:radial-gradient(circle at 40% 35%, #0d3a3f, #01131a 70%);
    display:flex;align-items:center;justify-content:center;
    box-shadow:inset 0 0 30px rgba(45,225,234,.5), 0 0 40px rgba(45,225,234,.25);
    transition:box-shadow .3s;cursor:pointer;
  }
  #core:active{transform:translate(-50%,-50%) scale(.96);}
  #core.listening{box-shadow:inset 0 0 40px rgba(45,225,234,.9), 0 0 60px rgba(45,225,234,.6);}
  #core.speaking{box-shadow:inset 0 0 40px rgba(120,255,230,.9), 0 0 70px rgba(120,255,230,.5);}
  #status{font-family:'Orbitron',sans-serif;font-weight:600;font-size:.78rem;letter-spacing:.15em;}
  #tapHint{position:absolute;bottom:16%;left:0;right:0;text-align:center;font-size:.65rem;opacity:.45;letter-spacing:.1em;}
  #timerBar{position:absolute;top:44px;left:0;right:0;text-align:center;font-size:.8rem;
    letter-spacing:.08em;color:#c9fbff;text-shadow:0 0 6px rgba(45,225,234,.6);min-height:1.2em;}

  #topbar{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;
    align-items:center;padding:14px 16px;font-size:.7rem;letter-spacing:.1em;}
  #topbar .label{opacity:.85}
  #settingsBtn, #weatherBtn, #muteBtn{background:none;border:1px solid var(--cyan-dim);color:var(--cyan);
    border-radius:6px;padding:6px 10px;font-family:'Share Tech Mono',monospace;}

  #transcript{position:absolute;bottom:22%;left:6%;right:6%;text-align:center;
    font-size:.85rem;min-height:1.4em;line-height:1.4em;color:#c9fbff;text-shadow:0 0 6px rgba(45,225,234,.6);}

  #panel{position:absolute;inset:0;background:rgba(2,6,10,.94);display:none;
    flex-direction:column;gap:14px;padding:24px;z-index:20;overflow-y:auto;}
  #panel.open{display:flex;}
  #panel h2{font-family:'Orbitron',sans-serif;letter-spacing:.1em;margin:0 0 6px;}
  #panel label{font-size:.72rem;opacity:.8;display:block;margin-bottom:4px;}
  #panel input, #panel select{width:100%;background:var(--panel);border:1px solid var(--cyan-dim);
    color:var(--cyan);padding:10px;border-radius:6px;font-family:'Share Tech Mono',monospace;margin-bottom:14px;}
  #panel button.primary{background:var(--cyan);color:#001a1d;border:none;padding:12px;border-radius:6px;
    font-family:'Orbitron',sans-serif;font-weight:600;letter-spacing:.05em;}
  #panel .note{font-size:.68rem;opacity:.6;line-height:1.4;}
  #textFallback{position:absolute;top:52px;left:6%;right:6%;display:flex;gap:8px;}
  #textFallback input{flex:1;background:var(--panel);border:1px solid var(--cyan-dim);color:var(--cyan);
    padding:8px;border-radius:6px;font-family:'Share Tech Mono',monospace;}
  #textFallback button{background:none;border:1px solid var(--cyan);color:var(--cyan);border-radius:6px;padding:8px 12px;}
  #colorSwatches{display:flex;gap:10px;margin-bottom:14px;}
  .swatch{width:38px;height:38px;border-radius:50%;border:2px solid transparent;cursor:pointer;flex-shrink:0;}
  .swatch.selected{border-color:#fff;box-shadow:0 0 8px rgba(255,255,255,.6);}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <span class="label" id="clock">--:--:--</span>
    <span class="label">SYSTEM // <span id="sysState">STANDBY</span></span>
    <div style="display:flex;gap:8px;">
      <button id="weatherBtn" title="Météo">🌤</button>
      <button id="muteBtn" title="Muet">🔊</button>
      <button id="settingsBtn">⚙</button>
    </div>
  </div>

  <div id="timerBar"></div>

  <div id="textFallback">
    <input id="textInput" placeholder="Ecrire à J.A.R.V.I.S...">
    <button id="sendText">➤</button>
  </div>

  <div class="rings">
    <div class="ring r1"></div>
    <div class="ring r2"></div>
    <div class="ring r3"></div>
    <div id="core"><div id="status">STANDBY</div></div>
  </div>
  <div id="tapHint">TOUCHER POUR PARLER</div>

  <div id="transcript"></div>
</div>

<div id="panel">
  <h2>RÉGLAGES</h2>
  <div>
    <label>Fournisseur IA</label>
    <select id="providerSelect">
      <option value="groq">Groq (gratuit — Llama 3.3 70B)</option>
      <option value="gemini">Google Gemini (gratuit)</option>
      <option value="melious">Melious (gratuit — EU, open-weight)</option>
      <option value="anthropic">Anthropic Claude (payant, 5$ offerts)</option>
    </select>
  </div>
  <div>
    <label id="claudeKeyLabel">Clé API</label>
    <input id="claudeKey" type="password" placeholder="colle ta clé ici">
  </div>
  <div class="note" id="providerHelp" style="margin-top:-10px;"></div>
  <div>
    <label>URL du relais (Cloudflare Worker) — laisser vide si non utilisé</label>
    <input id="proxyUrl" placeholder="https://jarvis-proxy.tonpseudo.workers.dev">
  </div>
  <div>
    <label>Clé API ElevenLabs</label>
    <input id="elKey" type="password" placeholder="xi-api-key">
  </div>
  <div>
    <label>Voice ID ElevenLabs (voix "Jarvis")</label>
    <input id="elVoice" placeholder="ex: 21m00Tcm4TlvDq8ikWAM">
    <a href="https://elevenlabs.io/app/voice-lab" target="_blank" style="font-size:.72rem;color:var(--cyan);display:block;margin:-8px 0 14px;">→ Trouver un Voice ID sur ElevenLabs</a>
  </div>
  <div>
    <label>Couleur du HUD</label>
    <div id="colorSwatches"></div>
  </div>
  <div>
    <label>Langue de reconnaissance vocale</label>
    <select id="langSelect">
      <option value="fr-FR">Français</option>
      <option value="en-US">English</option>
    </select>
  </div>
  <div>
    <label>Contacts (pour "envoie un message à..." / "appelle...")</label>
    <div style="display:flex;gap:8px;margin-bottom:8px;">
      <input id="contactName" placeholder="Nom" style="margin-bottom:0;">
      <input id="contactNumber" placeholder="N° téléphone" style="margin-bottom:0;">
    </div>
    <button type="button" id="addContact" style="background:none;border:1px solid var(--cyan);color:var(--cyan);border-radius:6px;padding:8px 12px;margin-bottom:12px;width:100%;">+ Ajouter le contact</button>
    <div id="contactList" style="font-size:.75rem;opacity:.85;margin-bottom:14px;"></div>
  </div>
  <div class="note">
    Ces infos sont sauvegardées dans ton navigateur (sur ce téléphone uniquement) pour ne pas avoir à les retaper. Elles ne sont jamais envoyées ailleurs qu'aux services choisis.
  </div>
  <button class="primary" id="closePanel">ACTIVER</button>
</div>

<script>
const el = id => document.getElementById(id);
const state = { provider:'groq', claudeKey:'', elKey:'', elVoice:'', proxyUrl:'', lang:'fr-FR', busy:false, color:'cyan', contacts:[], muted:false, history:[] };

const THEMES = {
  cyan:   { main:'#2de1ea', dim:'#0f7c82', rgb:'45,225,234' },
  red:    { main:'#ff3b3b', dim:'#8a1414', rgb:'255,59,59' },
  violet: { main:'#b06bff', dim:'#5a2f8a', rgb:'176,107,255' },
  green:  { main:'#39ff9e', dim:'#0f7a4c', rgb:'57,255,158' },
  amber:  { main:'#ffb020', dim:'#8a5a10', rgb:'255,176,32' }
};

function applyTheme(name){
  const t = THEMES[name] || THEMES.cyan;
  const root = document.documentElement.style;
  root.setProperty('--cyan', t.main);
  root.setProperty('--cyan-dim', t.dim);
  root.setProperty('--glow', `0 0 12px rgba(${t.rgb},.55)`);
  document.querySelectorAll('.swatch').forEach(s=> s.classList.toggle('selected', s.dataset.theme === name));
}

function renderSwatches(){
  const box = el('colorSwatches');
  box.innerHTML = '';
  Object.entries(THEMES).forEach(([name, t])=>{
    const sw = document.createElement('div');
    sw.className = 'swatch';
    sw.dataset.theme = name;
    sw.style.background = t.main;
    sw.onclick = ()=>{ state.color = name; applyTheme(name); };
    box.appendChild(sw);
  });
}
renderSwatches();

const providerInfo = {
  groq: {
    label:'Clé API Groq',
    help:'Gratuit. Crée un compte sur console.groq.com → API Keys → Create API Key. Aucune carte bancaire demandée.'
  },
  gemini: {
    label:'Clé API Google Gemini',
    help:'Gratuit. Va sur aistudio.google.com/apikey, connecte-toi avec un compte Google, clique "Create API key".'
  },
  melious: {
    label:'Clé API Melious',
    help:'Gratuit, sans carte bancaire. Crée un compte sur melious.ai → Account → API keys → Create API key.'
  },
  anthropic: {
    label:'Clé API Anthropic (Claude)',
    help:'5$ de crédits offerts à l\'inscription sur platform.claude.com, puis payant.'
  }
};
function updateProviderUI(){
  const info = providerInfo[state.provider];
  el('claudeKeyLabel').textContent = info.label;
  el('providerHelp').textContent = info.help;
}
el('providerSelect').addEventListener('change', e=>{
  state.provider = e.target.value;
  updateProviderUI();
});

const core = el('core'), statusEl = el('status'), sysState = el('sysState'), transcriptEl = el('transcript');

// clock
setInterval(()=>{ el('clock').textContent = new Date().toLocaleTimeString('fr-FR'); }, 1000);

// tick marks around ring 1
(function drawTicks(){
  const ring = document.querySelector('.ring.r1');
  const n = 60;
  for(let i=0;i<n;i++){
    const t = document.createElement('div');
    t.className='tick';
    t.style.transform = `rotate(${(360/n)*i}deg) translate(0,-1px)`;
    if(i%5!==0) t.style.height='5px';
    ring.appendChild(t);
  }
})();

function setState(s){
  sysState.textContent = s;
  statusEl.textContent = s;
  core.classList.remove('listening','speaking');
  if(s==='ÉCOUTE') core.classList.add('listening');
  if(s==='PAROLE') core.classList.add('speaking');
}

// settings panel
function saveSettings(){
  try{ localStorage.setItem('jarvisSettings', JSON.stringify(state)); }catch(e){}
}
el('settingsBtn').onclick = ()=> el('panel').classList.add('open');
el('muteBtn').onclick = ()=>{
  state.muted = !state.muted;
  el('muteBtn').textContent = state.muted ? '🔇' : '🔊';
  saveSettings();
};
el('muteBtn').textContent = state.muted ? '🔇' : '🔊';
el('closePanel').onclick = ()=>{
  state.provider = el('providerSelect').value;
  state.claudeKey = el('claudeKey').value.trim();
  state.elKey = el('elKey').value.trim();
  state.elVoice = el('elVoice').value.trim();
  state.proxyUrl = el('proxyUrl').value.trim();
  state.lang = el('langSelect').value;
  saveSettings();
  el('panel').classList.remove('open');
  setState('STANDBY');
};

function renderContacts(){
  const box = el('contactList');
  if(!state.contacts.length){ box.textContent = 'Aucun contact ajouté.'; return; }
  box.innerHTML = '';
  state.contacts.forEach((c, i)=>{
    const row = document.createElement('div');
    row.style.display='flex'; row.style.justifyContent='space-between'; row.style.alignItems='center';
    row.style.padding='6px 0'; row.style.borderBottom='1px solid rgba(45,225,234,.15)';
    row.innerHTML = `<span>${c.name} — ${c.number}</span>`;
    const del = document.createElement('button');
    del.textContent = '✕'; del.type='button';
    del.style.background='none'; del.style.border='none'; del.style.color='var(--cyan)'; del.style.cursor='pointer';
    del.onclick = ()=>{ state.contacts.splice(i,1); saveSettings(); renderContacts(); };
    row.appendChild(del);
    box.appendChild(row);
  });
}
el('addContact').onclick = ()=>{
  const name = el('contactName').value.trim();
  const number = el('contactNumber').value.trim();
  if(!name || !number) return;
  state.contacts.push({ name, number });
  el('contactName').value=''; el('contactNumber').value='';
  saveSettings();
  renderContacts();
};
// recharge les réglages sauvegardés précédemment
try{
  const saved = JSON.parse(localStorage.getItem('jarvisSettings') || 'null');
  if(saved){
    Object.assign(state, saved);
    el('providerSelect').value = state.provider;
    el('claudeKey').value = state.claudeKey;
    el('elKey').value = state.elKey;
    el('elVoice').value = state.elVoice;
    el('proxyUrl').value = state.proxyUrl;
    el('langSelect').value = state.lang;
  }
}catch(e){}
if(!state.contacts) state.contacts = [];
if(!state.history) state.history = [];
renderContacts();
applyTheme(state.color);
updateProviderUI();
el('muteBtn').textContent = state.muted ? '🔇' : '🔊';
// open settings on first load if no keys
if(!state.claudeKey) el('panel').classList.add('open');

// ---- Speech recognition ----
let recognition = null;
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
if(SpeechRecognition){
  recognition = new SpeechRecognition();
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.onstart = ()=> setState('ÉCOUTE');
  recognition.onerror = (e)=>{ setState('STANDBY'); transcriptEl.textContent = 'Erreur micro: '+e.error; };
  recognition.onresult = (e)=>{
    const text = e.results[0][0].transcript;
    transcriptEl.textContent = '"'+text+'"';
    handleUserInput(text);
  };
  recognition.onend = ()=>{ if(!state.busy) setState('STANDBY'); };
}else{
  transcriptEl.textContent = 'Reconnaissance vocale non supportée par ce navigateur, utilise le champ texte.';
}

core.onclick = ()=>{
  if(!recognition){ transcriptEl.textContent = 'Reconnaissance vocale non supportée, utilise le champ texte.'; return; }
  if(!state.claudeKey){ el('panel').classList.add('open'); return; }
  if(state.busy) return;
  recognition.lang = state.lang;
  try{ recognition.start(); }catch(e){}
};

el('sendText').onclick = ()=>{
  if(state.busy) return;
  const v = el('textInput').value.trim();
  if(!v) return;
  el('textInput').value='';
  transcriptEl.textContent = '"'+v+'"';
  handleUserInput(v);
};
el('textInput').addEventListener('keydown', e=>{ if(e.key==='Enter') el('sendText').click(); });

// ---- Minuteur ----
let timerInterval = null;
function beep(){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [0,0.35,0.7].forEach(delay=>{
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = 880;
      gain.gain.value = 0.25;
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(ctx.currentTime + delay);
      osc.stop(ctx.currentTime + delay + 0.25);
    });
  }catch(e){}
}
function startTimer(totalSeconds, label){
  if(timerInterval) clearInterval(timerInterval);
  let remaining = totalSeconds;
  const bar = el('timerBar');
  function render(){
    const m = Math.floor(remaining/60), s = remaining%60;
    bar.textContent = `⏱ ${label} — ${m}:${s.toString().padStart(2,'0')}`;
  }
  render();
  timerInterval = setInterval(()=>{
    remaining--;
    if(remaining <= 0){
      clearInterval(timerInterval); timerInterval = null;
      bar.textContent = `⏱ ${label} — TERMINÉ`;
      beep();
      transcriptEl.textContent = `Minuteur "${label}" terminé.`;
      setTimeout(()=>{ if(!timerInterval) bar.textContent=''; }, 8000);
    }else{
      render();
    }
  }, 1000);
}

// ---- SMS ----
function findContact(name){
  name = name.toLowerCase();
  return state.contacts.find(c => c.name.toLowerCase() === name || name.includes(c.name.toLowerCase()));
}
function openSMS(number, message){
  window.location.href = `sms:${number}?body=${encodeURIComponent(message)}`;
}

// ---- Météo (Open-Meteo, gratuit, sans clé) ----
async function getWeather(){
  return new Promise((resolve, reject)=>{
    if(!navigator.geolocation){ reject(new Error('Géolocalisation non disponible')); return; }
    navigator.geolocation.getCurrentPosition(async pos=>{
      try{
        const { latitude, longitude } = pos.coords;
        const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,weather_code`);
        const data = await res.json();
        resolve(data.current);
      }catch(e){ reject(e); }
    }, err=> reject(new Error('Position refusée')));
  });
}
function weatherCodeToText(code){
  if(code===0) return 'ciel dégagé';
  if([1,2,3].includes(code)) return 'partiellement nuageux';
  if([45,48].includes(code)) return 'brouillard';
  if([51,53,55,61,63,65,80,81,82].includes(code)) return 'pluie';
  if([71,73,75,77,85,86].includes(code)) return 'neige';
  if([95,96,99].includes(code)) return 'orage';
  return 'conditions variables';
}
async function announceWeather(){
  transcriptEl.textContent = 'Localisation en cours...';
  try{
    const w = await getWeather();
    const txt = `Il fait actuellement ${Math.round(w.temperature_2m)}°C, ${weatherCodeToText(w.weather_code)}.`;
    transcriptEl.textContent = txt;
    speak(txt);
  }catch(e){
    transcriptEl.textContent = 'Météo indisponible: '+e.message;
  }
}
el('weatherBtn').onclick = announceWeather;

// Détecte les commandes qu'on peut exécuter nous-mêmes, sans passer par l'IA.
// Retourne true si la commande a été traitée localement.
function tryLocalCommand(text){
  const low = text.toLowerCase();

  // Météo : "quel temps fait-il", "il fait quoi dehors", "météo"
  if(/m[ée]t[ée]o|quel temps|il fait (quoi|beau|froid|chaud)/.test(low)){
    announceWeather();
    return true;
  }

  // Minuteur : "mets un minuteur de 5 minutes", "minuterie 30 secondes", "chrono de 2h"
  if(/minut(eur|erie)|chrono/.test(low)){
    const match = low.match(/(\d+)\s*(heures?|h\b|minutes?|min\b|m\b|secondes?|sec\b|s\b)/);
    if(match){
      let n = parseInt(match[1]);
      const unit = match[2];
      let seconds = n;
      if(/heure|^h/.test(unit)) seconds = n*3600;
      else if(/minute|^min|^m/.test(unit)) seconds = n*60;
      startTimer(seconds, `${n} ${unit}`);
      transcriptEl.textContent = `Minuteur de ${n} ${unit} lancé, monsieur.`;
      speak(transcriptEl.textContent);
      return true;
    }
  }

  // SMS : "envoie un message à Paul dis-lui que j'arrive" / "sms à Paul : j'arrive"
  const smsMatch = low.match(/(?:envoie|envoyer|écris|ecris)\s+(?:un\s+)?(?:sms|message|texto)\s+(?:à|a)\s+([a-zàâéèêëîïôûüç\-]+)(.*)/i);
  if(smsMatch){
    const name = smsMatch[1].trim();
    let msg = smsMatch[2].trim();
    msg = msg.replace(/^(?:pour lui dire|dis[- ]lui que|dis[- ]lui|pour dire|disant)\s*/i, '').replace(/^[:,]\s*/, '');
    const contact = findContact(name);
    if(!contact){
      transcriptEl.textContent = `Je ne trouve pas "${name}" dans vos contacts. Ajoutez-le dans les réglages ⚙.`;
      speak(transcriptEl.textContent);
      return true;
    }
    if(!msg){ msg = 'Bonjour'; }
    transcriptEl.textContent = `J'ouvre Messages pour ${contact.name}. Il ne vous reste qu'à valider l'envoi.`;
    speak(`J'ouvre un message pour ${contact.name}.`);
    setTimeout(()=> openSMS(contact.number, msg), 600);
    return true;
  }

  return false;
}


// ---- AI call (multi-fournisseur) ----
const SYSTEM_PROMPT = "Tu es J.A.R.V.I.S., l'assistant IA de Tony Stark : calme, précis, brillant, un peu pince-sans-rire, toujours utile. Réfléchis avec soin et donne des réponses justes et complètes, mais reste concis à l'oral (2-4 phrases sauf si on te demande plus de détails). Réponds en français. Si on te demande une info d'actualité ou récente, utilise la recherche web pour vérifier avant de répondre.";

// Envoie la requête soit directement, soit via le relais Cloudflare (pour éviter les blocages CORS)
async function callProvider(targetUrl, headers, body){
  if(state.proxyUrl){
    const res = await fetch(state.proxyUrl, {
      method:'POST',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ targetUrl, headers, body })
    });
    if(!res.ok) throw new Error('Relais: '+res.status);
    return res.json();
  }else{
    const res = await fetch(targetUrl, { method:'POST', headers, body: JSON.stringify(body) });
    if(!res.ok) throw new Error('API: '+res.status);
    return res.json();
  }
}

async function askAI(prompt){
  if(state.provider === 'groq') return askGroq(prompt);
  if(state.provider === 'gemini') return askGemini(prompt);
  if(state.provider === 'melious') return askMelious(prompt);
  return askClaude(prompt);
}

async function askClaude(prompt){
  const data = await callProvider('https://api.anthropic.com/v1/messages',
    {
      'Content-Type':'application/json',
      'x-api-key': state.claudeKey,
      'anthropic-version':'2023-06-01',
      'anthropic-dangerous-direct-browser-access':'true'
    },
    { model:'claude-sonnet-4-6', max_tokens:500, system:SYSTEM_PROMPT, tools:[{ type:'web_search_20250305', name:'web_search' }], messages:[...state.history, {role:'user', content:prompt}] }
  );
  const textBlocks = data.content?.filter(b=>b.type==='text') || [];
  return textBlocks.map(b=>b.text).join(' ') || "...";
}

async function askGroq(prompt){
  const data = await callProvider('https://api.groq.com/openai/v1/chat/completions',
    { 'Content-Type':'application/json', 'Authorization':'Bearer '+state.claudeKey },
    { model:'groq/compound', max_tokens:500, messages:[
      {role:'system', content:SYSTEM_PROMPT},
      ...state.history,
      {role:'user', content:prompt}
    ]}
  );
  return data.choices?.[0]?.message?.content || "...";
}

async function askGemini(prompt){
  const historyContents = state.history.map(h => ({
    role: h.role === 'assistant' ? 'model' : 'user',
    parts:[{ text: h.content }]
  }));
  const data = await callProvider(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${state.claudeKey}`,
    { 'Content-Type':'application/json' },
    { systemInstruction:{ parts:[{ text:SYSTEM_PROMPT }] }, tools:[{ google_search:{} }], contents:[...historyContents, { role:'user', parts:[{ text:prompt }] }] }
  );
  const cands = data.candidates?.[0]?.content?.parts || [];
  return cands.map(p=>p.text).filter(Boolean).join(' ') || "...";
}

async function askMelious(prompt){
  const data = await callProvider('https://api.melious.ai/v1/chat/completions',
    { 'Content-Type':'application/json', 'Authorization':'Bearer '+state.claudeKey },
    { model:'gpt-oss-120b', messages:[
      {role:'system', content:SYSTEM_PROMPT},
      ...state.history,
      {role:'user', content:prompt}
    ]}
  );
  return data.choices?.[0]?.message?.content || "...";
}

// ---- ElevenLabs TTS ----
let currentAudio = null;
async function speak(text){
  if(state.muted || !state.elKey || !state.elVoice){
    return;
  }
  // Coupe toute voix encore en cours pour éviter les réponses qui se chevauchent
  if(currentAudio){
    currentAudio.pause();
    currentAudio = null;
  }
  setState('PAROLE');
  try{
    const res = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${state.elVoice}`, {
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'xi-api-key': state.elKey
      },
      body: JSON.stringify({
        text: text,
        model_id:'eleven_turbo_v2_5',
        voice_settings:{ stability:0.5, similarity_boost:0.75 }
      })
    });
    if(!res.ok){
      const errText = await res.text();
      throw new Error('ElevenLabs '+res.status+': '+errText.slice(0,150));
    }
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const audio = new Audio(url);
    currentAudio = audio;
    audio.onended = ()=>{ if(currentAudio===audio) currentAudio=null; setState('STANDBY'); };
    await audio.play();
  }catch(e){
    console.error(e);
    transcriptEl.textContent += '  [Voix indisponible: '+e.message+']';
    setState('STANDBY');
  }
}

async function handleUserInput(text){
  if(tryLocalCommand(text)) return;
  if(!state.claudeKey){ transcriptEl.textContent = 'Configure ta clé API dans les réglages ⚙'; el('panel').classList.add('open'); return; }
  state.busy = true;
  setState('ANALYSE');
  try{
    const reply = await askAI(text);
    state.history.push({role:'user', content:text}, {role:'assistant', content:reply});
    if(state.history.length > 12) state.history = state.history.slice(-12);
    transcriptEl.textContent = reply;
    await speak(reply);
    if(!state.elKey || !state.elVoice || state.muted) setState('STANDBY');
  }catch(e){
    console.error(e);
    transcriptEl.textContent = 'Erreur: '+e.message;
    setState('STANDBY');
  }
  state.busy = false;
}
